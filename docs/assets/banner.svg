<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">Banner do Repos-Compass</title>
  <desc id="d">Ilustração (não é captura de tela): bússola estilizada ao lado do título Repos-Compass e do texto Entregas do Programa de Bolsas Compass UOL, Práticas de AWS, FURG, IFRS e UFFS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F33"/><stop offset="1" stop-color="#12395C"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <g stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2">
    <path d="M0 90H1280M0 180H1280M0 270H1280M320 0V360M640 0V360M960 0V360"/>
  </g>
  <!-- bússola -->
  <g transform="translate(250 180)">
