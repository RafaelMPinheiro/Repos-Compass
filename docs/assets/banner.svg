    <text x="442" y="232" font-size="32" fill="#FFB74D" font-weight="600">Entregas do Programa de Bolsas Compass UOL</text>
    <text x="442" y="282" font-size="30" fill="#DCE6F0">Práticas de AWS · FURG, IFRS e UFFS</text>
